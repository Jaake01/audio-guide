<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>日本語音導覽</title>
  <meta name="theme-color" content="#b3261e">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="top">
    <h1 id="title">附近景點</h1>
  </header>

  <main id="view" aria-live="polite"></main>

  <!-- 迷你播放列：離開播放頁時還在播放，就顯示在底部 -->
  <button id="mini" class="mini" hidden>
    <span class="mini-icon" id="mini-icon">▶</span>
    <span class="mini-text"><b id="mini-name"></b><small id="mini-sec"></small></span>
  </button>

  <nav class="tabs" aria-label="主選單">
    <a href="#/nearby" data-tab="nearby"><span>📍</span>附近</a>
    <a href="#/map" data-tab="map"><span>🗺️</span>地圖</a>
    <a href="#/today" data-tab="trip"><span>📅</span>行程</a>
  </nav>

  <audio id="audio" preload="metadata"></audio>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
